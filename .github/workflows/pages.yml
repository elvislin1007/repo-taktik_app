name: 發布算分網頁到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 打包 units.json（單位）和 weapons.json（共用武器庫），網頁讀這兩個檔，不用權杖
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          def bundle(root):
              out = []
              for p in sorted(pathlib.Path(root).rglob('*.json')):
                  try:
                      out.append({'path': p.as_posix(), 'data': json.loads(p.read_text(encoding='utf-8'))})
                  except Exception as e:
                      print(f'::warning file={p}::略過（JSON 讀不了）：{e}')
              return out
          units = bundle('units')
          weapons = bundle('weapons')
          pathlib.Path('units.json').write_text(json.dumps({'generatedAt': now, 'units': units}, ensure_ascii=False), encoding='utf-8')
          pathlib.Path('weapons.json').write_text(json.dumps({'generatedAt': now, 'items': weapons}, ensure_ascii=False), encoding='utf-8')
          print(f'{len(units)} 個單位、{len(weapons)} 把武器')
          PY
      - name: 蓋上版本號（檔案網址加 ?v=版本，手機不會用到舊檔；舊頁面保存前會被擋下來）
        run: |
          echo "{\"build\": \"${GITHUB_SHA}\"}" > version.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" app.js index.html player/index.html
          grep -c "${GITHUB_SHA}" app.js index.html player/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
