name: 發布算分網頁到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 把所有單位打包成 units.json（玩家端圖鑑讀這個，不用權杖）
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          units = []
          for p in sorted(pathlib.Path('units').rglob('*.json')):
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'::warning file={p}::略過（JSON 讀不了）：{e}')
                  continue
              units.append({'path': p.as_posix(), 'data': data})
          out = {'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'units': units}
          pathlib.Path('units.json').write_text(json.dumps(out, ensure_ascii=False), encoding='utf-8')
          print(f'{len(units)} 個單位')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
