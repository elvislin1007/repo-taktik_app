<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taktik">
<title>Taktik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 資料卡字型：沒有 Calibri／新細明體 的裝置（iPhone、Mac…）改用字寬相同的 Carlito 和明體 Noto Serif TC -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="../card.css?v=__BUILD__">
<link rel="stylesheet" href="player.css?v=__BUILD__">
</head>
<body>
<!-- 頂端列：左邊選單、中間標誌 -->
<header class="topbar">
  <button type="button" class="icon-btn" id="btn-menu" aria-label="開啟選單" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="Taktik 首頁"><span class="b1">TAK</span><span class="b2">TIK</span></a>
  <span class="topbar-end" aria-hidden="true"></span>
</header>

<!-- 側邊選單（從左邊滑出） -->
<div class="scrim" id="scrim" hidden></div>
<button type="button" class="drawer-close" id="btn-close" aria-label="關閉選單" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
</button>
<nav class="drawer" id="drawer" aria-label="主選單" tabindex="-1" hidden>
  <form class="drawer-search" id="drawer-search" role="search">
    <input id="ds-q" type="search" placeholder="搜尋單位…" autocomplete="off" enterkeyhint="search" aria-label="搜尋單位">
    <button type="submit" class="ds-go" aria-label="搜尋">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </form>
  <ul class="menu" id="menu"></ul>
</nav>

<main>
  <!-- 首頁 -->
  <section id="screen-home" class="screen" aria-labelledby="home-title">
    <div class="hero">
      <h1 id="home-title" class="hero-brand"><span class="b1">TAK</span><span class="b2">TIK</span></h1>
      <p class="hero-sub">Taktik 戰棋單位資料庫</p>
      <a class="cta" href="#/units">瀏覽單位圖鑑</a>
    </div>
    <div class="home-sections" id="home-sections"></div>
  </section>

  <!-- 單位圖鑑：列表 -->
  <section id="screen-list" class="screen" hidden aria-labelledby="list-title">
    <div class="pagehead">
      <h2 id="list-title">單位圖鑑</h2>
      <button type="button" class="icon-btn dark" id="btn-refresh" aria-label="重新整理資料">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="toolbar">
      <p class="scope" id="scope"></p>
      <div class="listhead">
        <span id="count" role="status"></span>
        <label class="sort">排序
          <select id="sort">
            <option value="cat">類別</option>
            <option value="name">名稱</option>
            <option value="pts-desc">分數高→低</option>
            <option value="pts-asc">分數低→高</option>
          </select>
        </label>
      </div>
    </div>
    <div class="list" id="list" aria-live="polite"></div>
  </section>

  <!-- 單位圖鑑：單位內容 -->
  <section id="screen-unit" class="screen" hidden aria-labelledby="unit-title">
    <div class="pagehead">
      <button type="button" class="icon-btn dark" id="btn-back" aria-label="返回列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="unit-title"></h2>
    </div>
    <div class="unit">
      <p class="unit-path" id="unit-path"></p>
      <div class="card-frame" id="card-frame"></div>
      <p class="unit-meta" id="unit-meta"></p>
    </div>
  </section>

  <!-- 關鍵字：只能搜尋、看說明 -->
  <section id="screen-keywords" class="screen" hidden aria-labelledby="kw-title">
    <div class="pagehead">
      <h2 id="kw-title">關鍵字</h2>
    </div>
    <div class="toolbar">
      <form class="search" id="kw-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="kw-q" type="search" placeholder="搜尋關鍵字名稱、英文、說明…" autocomplete="off" enterkeyhint="search" aria-label="搜尋關鍵字">
      </form>
      <div class="listhead"><span id="kw-count" role="status"></span></div>
    </div>
    <div class="list" id="kw-list"></div>
  </section>

  <!-- 組軍表：清單 -->
  <section id="screen-armies" class="screen" hidden aria-labelledby="armies-title">
    <div class="pagehead">
      <h2 id="armies-title">組軍表</h2>
    </div>
    <div class="toolbar">
      <p class="scope">軍表只存在這台裝置（換手機或清除瀏覽器資料就會不見；要保存請匯出 PDF）。</p>
      <button type="button" class="primary" id="army-new">＋ 新增軍表</button>
    </div>
    <div class="list" id="armies-list"></div>
  </section>

  <!-- 組軍表：編輯一份 -->
  <section id="screen-army" class="screen" hidden aria-labelledby="army-name">
    <div class="pagehead">
      <a class="icon-btn dark" href="#/armies" aria-label="返回軍表清單">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <input id="army-name" class="army-name" aria-label="軍表名稱" autocomplete="off">
    </div>
    <div class="army-bar">
      <div class="army-total" id="army-total" role="status"></div>
      <div class="army-btns">
        <button type="button" class="primary" id="army-add">＋ 加入單位</button>
        <button type="button" id="army-pdf">匯出 PDF</button>
      </div>
    </div>
    <details class="army-rules">
      <summary>規則設定（分數上限、類別數量）</summary>
      <label class="cap-row">分數上限 <input id="army-cap" type="number" inputmode="numeric" min="0" step="50" placeholder="不限"> pts</label>
      <div class="lim-box">
        <div class="lim-title">類別數量限制 <button type="button" id="army-limits-reset">全部改回不限</button></div>
        <div id="army-limits"></div>
      </div>
      <p class="hint">同一個「人物(獨特)」只能放 1 個，會自動檢查。</p>
    </details>
    <div class="notice army-warn" id="army-warn" role="alert" hidden></div>
    <div id="army-body"></div>
  </section>
</main>

<!-- 組軍表：加入單位（從資料庫挑，可以連續加） -->
<div class="kw-sheet-wrap pick-wrap" id="pick-wrap" hidden>
  <div class="kw-scrim" id="pick-scrim"></div>
  <section class="kw-sheet pick-sheet" role="dialog" aria-modal="true" aria-labelledby="pick-title">
    <div class="pick-head">
      <h3 id="pick-title">加入單位</h3>
      <button type="button" class="primary" id="pick-done">完成</button>
    </div>
    <div class="pick-tools">
      <input id="pick-q" type="search" placeholder="搜尋單位名稱、關鍵字、武器…" autocomplete="off" aria-label="搜尋單位">
    </div>
    <div class="pick-catbar" id="pick-catbar" hidden></div>
    <nav class="pick-crumbs" id="pick-crumbs" aria-label="目前範圍"></nav>
    <p class="pick-status"><span id="pick-total"></span>　<span id="pick-msg" role="status"></span></p>
    <div class="pick-body" id="pick-body"></div>
  </section>
</div>

<!-- 匯出 PDF 用的列印內容（平常隱藏） -->
<div id="print-root" class="print-root" aria-hidden="true"></div>

<!-- 關鍵字說明（點資料卡上的藍色虛線字跳出來；按返回回上一個） -->
<div class="kw-sheet-wrap" id="kw-sheet-wrap" hidden>
  <div class="kw-scrim" id="kw-scrim"></div>
  <section class="kw-sheet" id="kw-sheet" role="dialog" aria-modal="true" aria-labelledby="kws-name" tabindex="-1">
    <div class="kws-head">
      <button type="button" class="kws-back" id="kws-back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="kws-back-label">返回</span>
      </button>
    </div>
    <h3 class="kws-name" id="kws-name"></h3>
    <p class="kws-en" id="kws-en"></p>
    <div class="kws-body" id="kws-body"></div>
    <p class="kws-group" id="kws-group"></p>
  </section>
</div>

<script src="../keywords.js?v=__BUILD__"></script>
<script src="../calc.js?v=__BUILD__"></script>
<script src="../repo.js?v=__BUILD__"></script>
<script src="../cardview.js?v=__BUILD__"></script>
<script src="player.js?v=__BUILD__"></script>
<script src="army.js?v=__BUILD__"></script>
</body>
</html>
