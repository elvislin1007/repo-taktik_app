<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taktik 圖鑑">
<title>Taktik 單位圖鑑</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="stylesheet" href="../card.css">
<link rel="stylesheet" href="player.css">
</head>
<body>
<!-- 列表 -->
<section id="screen-list" class="screen" aria-labelledby="list-title">
  <header class="appbar">
    <h1 id="list-title">單位圖鑑</h1>
    <div class="appbar-actions">
      <button type="button" class="icon-btn" id="btn-refresh" aria-label="重新整理資料">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋名稱、關鍵字、能力、武器…" autocomplete="off" enterkeyhint="search" aria-label="搜尋單位">
    </label>
    <nav class="crumbs" id="crumbs" aria-label="分類路徑"></nav>
    <div class="chips" id="chips" role="list" aria-label="下一層分類"></div>
    <div class="listhead">
      <span id="count" role="status"></span>
      <label class="sort">排序
        <select id="sort">
          <option value="name">名稱</option>
          <option value="pts-desc">分數高→低</option>
          <option value="pts-asc">分數低→高</option>
        </select>
      </label>
    </div>
  </div>

  <main class="list" id="list" aria-live="polite"></main>
</section>

<!-- 單位內容 -->
<section id="screen-unit" class="screen" hidden aria-labelledby="unit-title">
  <header class="appbar">
    <button type="button" class="icon-btn" id="btn-back" aria-label="返回列表">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="unit-title"></h1>
    <a class="appbar-btn" id="btn-edit" href="../" title="在算分編輯器重新編輯（保存需要權杖）">編輯</a>
  </header>
  <main class="unit">
    <p class="unit-path" id="unit-path"></p>
    <div class="card-frame" id="card-frame"></div>
    <p class="unit-meta" id="unit-meta"></p>
  </main>
</section>


<script src="../calc.js"></script>
<script src="../repo.js"></script>
<script src="../cardview.js"></script>
<script src="player.js"></script>
</body>
</html>
